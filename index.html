<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petpooja Inventory Entry Flow</title>
<style>

:root{
  --bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;
  --nav:#1d1d1f;--navdim:#a1a1a6;--accent:#0071e3;--accentsoft:#0071e314;
  --path:#0071e3;--dim:#e8e8ed;--radius:3px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:44px auto minmax(0,1fr)}
.nav{background:var(--nav);color:#f5f5f7;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:12px}
.nav .brand{font-weight:600;letter-spacing:.01em;white-space:nowrap}
.nav .tabs{display:flex;gap:2px;flex:1;overflow:auto}
.nav .tabs button{background:transparent;border:0;color:var(--navdim);padding:8px 10px;border-radius:3px;font-size:12px;white-space:nowrap}
.nav .tabs button:hover{color:#fff}.nav .tabs button.active{color:#fff;background:#ffffff14}
.nav .right{display:flex;gap:8px}
.nav .right button{background:transparent;border:1px solid #424245;color:#f5f5f7;border-radius:980px;padding:4px 10px;font-size:11px}
.nav .right button:hover{background:#ffffff14}
.sub{background:var(--paper);border-bottom:1px solid var(--line);padding:12px 18px 10px}
.sub h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em}
.sub p{margin:4px 0 0;color:var(--muted);font-size:12.5px;max-width:980px}
.flowbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:980px;padding:6px 11px;font-size:12px;font-weight:500}
.chip:hover{background:#f5f5f7}.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.5;margin-right:4px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.canvas{min-width:0;min-height:0;display:flex;flex-direction:column}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.tools b{color:var(--ink)}.tools .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:980px;padding:3px 8px;background:#fff}
.pill i{width:14px;height:3px;border-radius:2px;background:#8aa3c4;display:inline-block}
.pill i.in{background:#7a9e8a}.pill i.out{background:#c4928e}.pill i.con{background:#8aa3c4}
.pill i.link{width:16px;height:0;border-top:2px dashed #b7a58a;background:0;border-radius:0}
.pill i.info{background:#9aa3ad}
.diagram{flex:1;overflow:auto;padding:16px 14px 24px;background:var(--bg)}
.diagram svg{display:block;width:100%;min-width:1100px;height:auto}
.legend{padding:8px 14px;background:var(--paper);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.panelpage{padding:16px 18px 28px;overflow:auto;background:var(--bg)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.card h2{margin:0;padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
.card .pad{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:var(--radius)}
.stat strong{display:block;font-size:20px;letter-spacing:-.02em}.stat span{font-size:11.5px;color:var(--muted)}
.mod{text-align:left;width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:12px;color:var(--ink)}
.mod:hover{border-color:#86868b}.mod strong{display:block;font-size:13px}.mod small{display:block;margin-top:4px;color:var(--muted);line-height:1.4}
.data-table{width:100%;border-collapse:collapse;font-size:11.5px}
.data-table th{text-align:left;font-size:10px;color:var(--muted);padding:8px 10px;background:#fbfbfd;border-bottom:1px solid var(--line);position:sticky;top:0}
.data-table td{padding:8px 10px;border-bottom:1px solid #ececef;vertical-align:top;color:#424245}
.mono{font-family:var(--mono);font-size:11px;color:#424245}
.catalog{display:grid;grid-template-columns:280px 1fr;gap:12px;min-height:60vh}
.result-list{max-height:70vh;overflow:auto}
.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #ececef;background:transparent;padding:10px 12px}
.result:hover{background:#f5f5f7}.result.selected{background:var(--accentsoft);box-shadow:inset 2px 0 var(--accent)}
.result strong{display:block;font-size:12px}.result .sub{font-size:10.5px;color:var(--muted);margin-top:2px}
.ssgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sscell{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:10px;min-height:72px}
.sscell .c{font-weight:700;font-size:11px;color:var(--accent)}.sscell b{display:block;font-size:12px;margin:2px 0}.sscell span{font-size:10.5px;color:var(--muted)}
.callout{border:1px solid var(--line);border-left:2px solid #86868b;background:#fbfbfd;padding:10px 12px;font-size:12.5px;color:#424245;border-radius:var(--radius)}
.callout b{color:var(--ink)}
/* svg */
.node{cursor:pointer}
.node .box{fill:#fff;stroke:#c7c7cc;stroke-width:1}
.node text{font-family:var(--font);fill:var(--ink);font-size:12px;font-weight:600;pointer-events:none}
.node .sub{font-size:10.5px;font-weight:400;fill:var(--muted)}
.node .meta{font-size:9.5px;font-weight:500;fill:#86868b;font-family:var(--mono)}
.node.dim .box{fill:#fcfcfd;stroke:#e8e8ed}
.node.dim text{fill:#8e8e93;opacity:.92}.node.dim .sub,.node.dim .meta{fill:#aeaeb2}
.node.on .box,.node:hover .box{stroke:var(--path);stroke-width:1.75}
.node.soft .box{stroke:#aeb4bc}
.node.selected .box{stroke:var(--ink);stroke-width:2}
.badge-bg{fill:#f5f5f7}.badge{font-size:8.5px;font-weight:600;fill:#6e6e73}
.edge{fill:none;stroke:#c9cdd3;stroke-width:1.35;pointer-events:stroke;cursor:pointer}
.edge.link{stroke:#b7a58a;stroke-dasharray:6 5;stroke-width:1.3} /* doc join, no stock */
.edge.stockin{stroke:#7a9e8a} /* goods / qty into stock */
.edge.stockout{stroke:#c4928e} /* goods / qty leaving stock */
.edge.consume{stroke:#8aa3c4} /* POS theoretical use */
.edge.info{stroke:#9aa3ad} /* summary / informational */
.edge.dash{stroke-dasharray:6 5}
.edge.on{stroke-width:2.35;filter:none}
.edge.link.on{stroke:#9a7b4f}
.edge.stockin.on{stroke:#3f7a5c}
.edge.stockout.on{stroke:#b85c55}
.edge.consume.on{stroke:#4a6fa5}
.edge.info.on{stroke:#5c6b7a}
.edge.dim{stroke:##d5d7dc;stroke-width:1.1;opacity:.42}
.edge:hover{stroke-width:2.1}
.elabel{font-size:9.5px;fill:#8b9098;font-weight:500;pointer-events:none}
.elabel.link{fill:#9a7b4f}.elabel.stockin{fill:#3f7a5c}.elabel.stockout{fill:#b85c55}
.elabel.consume{fill:#4a6fa5}.elabel.info{fill:#5c6b7a}
.elabel.on{font-weight:650}
.lane{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;fill:#86868b}
/* insp */
.insp{border-left:1px solid var(--line);background:var(--paper);min-height:0;overflow:auto}
.insp-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.insp-head{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:2}
.insp-head .eye{font-size:11px;color:var(--muted)}.insp-head h2{margin:4px 0 6px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.insp-head p{margin:0;color:var(--muted);font-size:12.5px}
.pathsteps{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.pathsteps span{border:1px solid var(--line);border-radius:2px;padding:3px 7px;font-size:10.5px;color:var(--muted);background:#fbfbfd}
.pathsteps span.on{border-color:var(--path);color:var(--path);background:var(--accentsoft)}
.insp-body{padding:12px 16px 24px;display:grid;gap:10px}
.panel{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.panel h3{margin:0;padding:8px 10px;font-size:11px;font-weight:600;color:var(--muted);background:#fbfbfd;border-bottom:1px solid var(--line)}
.panel .p{padding:10px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:5px 8px;font-size:12px}
.kv b{color:var(--muted);font-weight:500}.kv span{overflow-wrap:anywhere}
.ex{border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px;background:#fbfbfd;font-size:12.5px;line-height:1.5}
.ex strong{display:block;margin-bottom:4px;font-size:12px}
.ex .rule{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:#424245}
.steps{margin:0;padding-left:16px}.steps li{margin:5px 0;font-size:12.5px;color:#424245}
.coltable{width:100%;border-collapse:collapse;font-size:11.5px}
.coltable th,.coltable td{padding:6px 9px;border-bottom:1px solid #ececef;text-align:left;vertical-align:top}
.coltable th{font-size:10px;color:var(--muted);background:#fbfbfd}
.btn{border:1px solid var(--line);background:#fff;border-radius:980px;padding:6px 11px;font-size:12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{display:inline-flex;border:1px solid var(--line);border-radius:980px;padding:2px 7px;font-size:10.5px;color:var(--muted);background:#fff}
.tag.on{border-color:var(--path);color:var(--path);background:var(--accentsoft)}
@media(max-width:1100px){.work{grid-template-columns:1fr}.insp{border-left:0;border-top:1px solid var(--line);max-height:40vh}.catalog,.grid2,.grid3,.ssgrid{grid-template-columns:1fr}}

.live-anim{border-top:1px solid var(--line);background:var(--paper);padding:12px 14px 16px}
.anim-empty{padding:14px;color:var(--muted);font-size:12.5px;text-align:center}
.anim-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.anim-eye{font-size:11px;color:var(--muted);margin-bottom:2px}
.anim-controls{display:flex;gap:6px}
.anim-picks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.anim-track{display:flex;align-items:center;gap:0;overflow:auto;padding:4px 0 12px}
.anim-node{min-width:110px;max-width:150px;border:1px solid var(--line);background:#fbfbfd;border-radius:3px;padding:8px;opacity:.55;transition:all .35s ease}
.anim-node span{display:inline-block;width:18px;height:18px;border-radius:50%;background:#e8e8ed;color:#6e6e73;font-size:10px;font-weight:700;text-align:center;line-height:18px;margin-right:4px}
.anim-node b{display:block;font-size:11px;font-weight:600;margin-top:4px;line-height:1.3}
.anim-node.on{opacity:1;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accentsoft)}
.anim-node.on span{background:var(--accent);color:#fff}
.anim-node.done{opacity:.85;border-color:#7a9e8a}
.anim-node.done span{background:#7a9e8a;color:#fff}
.anim-pipe{width:28px;height:2px;background:#d2d2d7;flex:0 0 28px;position:relative;overflow:hidden}
.anim-node.on + .anim-pipe,.anim-node.done + .anim-pipe{background:#7a9e8a}
.anim-pipe::after{content:"";position:absolute;left:-20px;top:0;width:16px;height:2px;background:var(--accent);animation:pipemove 1.2s linear infinite;opacity:0}
.anim-node.on + .anim-pipe::after{opacity:1}
@keyframes pipemove{to{left:30px}}
.anim-stage{display:grid;grid-template-columns:1.4fr .8fr;gap:10px}
.anim-card,.anim-stock{border:1px solid var(--line);border-radius:3px;padding:12px;background:#fff}
.anim-card h4,.anim-stock h4{margin:0 0 6px;font-size:13px}
.anim-card p{margin:0 0 10px;color:#424245;font-size:12.5px;line-height:1.5}
.anim-meta{display:grid;grid-template-columns:88px 1fr;gap:4px 8px;font-size:12px;margin-top:4px}
.anim-meta b{color:var(--muted);font-weight:500}
.stock-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f2;font-size:12.5px}
.stock-row strong{font-variant-numeric:tabular-nums}
.pulse{animation:pulse .6s ease}
@keyframes pulse{0%{transform:scale(1.15);color:var(--accent)}100%{transform:scale(1);color:var(--ink)}}
.anim-progress{height:3px;background:#eee;border-radius:2px;margin-top:12px;overflow:hidden}
.anim-progress > div{height:100%;background:linear-gradient(90deg,#7a9e8a,var(--accent));transition:width .4s ease}
@media(max-width:900px){.anim-stage{grid-template-columns:1fr}}

</style>
</head>

</div>

/* Soft cubic curves — avoid rigid right-angle elbows */
function edgePath(A, B) {
  const ax = A.x + A.w / 2, ay = A.y + A.h / 2;
  const bx = B.x + B.w / 2, by = B.y + B.h / 2;
  const dx = bx - ax, dy = by - ay;
  const dist = Math.hypot(dx, dy) || 1;
  // pull control points along the dominant axis for a gentle S-curve
  const pull = Math.min(120, dist * 0.45);
  let c1x, c1y, c2x, c2y;
  if (Math.abs(dx) >= Math.abs(dy)) {
    c1x = ax + Math.sign(dx || 1) * pull;
    c1y = ay;
    c2x = bx - Math.sign(dx || 1) * pull;
    c2y = by;
  } else {
    c1x = ax;
    c1y = ay + Math.sign(dy || 1) * pull;
    c2x = bx;
    c2y = by - Math.sign(dy || 1) * pull;
  }
  // slight vertical/horizontal bias so parallel edges fan apart
  const fan = ((A.id.charCodeAt(0) + B.id.charCodeAt(0)) % 7 - 3) * 4;
  if (Math.abs(dx) >= Math.abs(dy)) { c1y += fan; c2y -= fan; }
  else { c1x += fan; c2x -= fan; }
  return `M ${ax} ${ay} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${bx} ${by}`;
}

function edgeLabelPoint(A, B) {
  const ax = A.x + A.w / 2, ay = A.y + A.h / 2;
  const bx = B.x + B.w / 2, by = B.y + B.h / 2;
  return { x: (ax + bx) / 2, y: (ay + by) / 2 - 8 };
}

function importantCols(table, names) {
  const all = SCHEMA[table] || [];
  if (!names?.length) return all.slice(0, 12);
  const set = new Set(names);
  const picked = all.filter((c) => set.has(c.name));
  return picked.length ? picked : all.slice(0, 12);
}

const KIND_WHY = {
  link: 'Document / master join only — does not change stock_masters by itself.',
  stockin: 'Stock inward — qty enters live stock (purchase, excess, production out).',
  stockout: 'Stock outward — qty leaves sender stock (dispatch, return, wastage, shortage, production in).',
  consume: 'POS theoretical consumption from recipe — reduces stock as Summary D.',
  info: 'Reporting / snapshot link (summary column or EOD close), not a separate movement type.'
};
function edgeDetail(e) {
  const kind = e.kind || (e.dash ? 'link' : 'info');
  return {
    title: e.label ? `Join: ${e.label}` : 'Join line',
    blurb: e.why || KIND_WHY[kind] || 'Connection on this flow.',
    tags: [{link:'Doc link',stockin:'Stock in',stockout:'Stock out',consume:'POS consume',info:'Info'}[kind] || kind],
    kv: [['Kind', kind], ['From', e.a], ['To', e.b], ['Join', e.join || '—'], ['Why', e.why || KIND_WHY[kind]]],
    example: `<div class="ex"><strong>Example on this line</strong>${esc(e.example || 'Part of the active path.')}<div class="rule">${esc(e.why || KIND_WHY[kind])}${e.join ? '\n' + esc(e.join) : ''}</div></div>`,
    joinText: e.join || ''
  };
}

/* ========== State ========== */
let section = 'flows';
let flow = 'supplier';
let graph = null;
let activeNodes = new Set();
let activeEdges = setFrom([]);
let selectedNode = null;
let pathLocked = false; // false = show full diagram; true = highlight clicked path
let schemaTable = Object.keys(SCHEMA)[0];
let schemaQ = '';

function setFrom(arr) { return new Set(arr); }

function applyDefaultPath() {
  const f = FLOWS.find((x) => x.id === flow);
  activeNodes = setFrom(f.defaultPath);
  activeEdges = setFrom(f.defaultEdges);
  selectedNode = null;
  pathLocked = false; // overview: nothing washed out
}

function pathForNode(kind, nodeId) {
  const bp = graph.branchPaths?.[kind] || graph.branchPaths?.[nodeId];
  if (bp) return bp;
  // walk: highlight default path but emphasize node + incident edges
  const f = FLOWS.find((x) => x.id === flow);
  const nodes = new Set(f.defaultPath);
  nodes.add(nodeId);
  const edges = new Set(f.defaultEdges);
  graph.edges.forEach((e) => {
    if (e.a === nodeId || e.b === nodeId) edges.add(e.id);
  });
  // also include connected default-path neighbors
  graph.edges.forEach((e) => {
    if (edges.has(e.id)) { nodes.add(e.a); nodes.add(e.b); }
  });
  return { nodes: [...nodes], edges: [...edges] };
}

function renderInspector(detail, pathSteps) {
  if (!detail) {
    $('#insp').innerHTML = `<div class="insp-empty">Click a node to highlight its path and see joins, columns, and a worked example.</div>`;
    return;
  }
  const tags = (detail.tags || []).map((t) => `<span class="tag on">${esc(t)}</span>`).join(' ');
  const steps = (pathSteps || []).map((s) => `<span class="${s.on ? 'on' : ''}">${esc(s.label)}</span>`).join('');
  const kv = (detail.kv || []).map(([k, v]) => `<b>${esc(k)}</b><span>${esc(v)}</span>`).join('');
  const how = detail.how?.length ? `<div class="panel"><h3>How it happens</h3><div class="p"><ol class="steps">${detail.how.map((x) => `<li>${x}</li>`).join('')}</ol></div></div>` : '';
  let cols = '';
  if (detail.table) {
    const list = importantCols(detail.table, detail.focus || []);
    cols = `<div class="panel"><h3>Columns · ${esc(detail.table)}</h3><div class="p" style="padding:0"><table class="coltable"><thead><tr><th>Column</th><th>Meaning</th></tr></thead><tbody>${list.map((c) => `<tr><td class="mono">${esc(c.name)}</td><td>${esc(c.desc)}${c.ds ? ` <span class="tag">${esc(c.ds)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  const joinBox = detail.joinText ? `<div class="panel"><h3>Join columns</h3><div class="p"><div class="mono" style="white-space:pre-wrap">${esc(detail.joinText)}</div></div></div>` : '';
  $('#insp').innerHTML = `<div class="insp-head"><div class="eye">Path detail</div><h2>${esc(detail.title)}</h2><p>${esc(detail.blurb || '')}</p><div style="margin-top:8px">${tags}</div>${steps ? `<div class="pathsteps">${steps}</div>` : ''}</div><div class="insp-body">${detail.example || ''}${joinBox}${kv ? `<div class="panel"><h3>Fields</h3><div class="p"><div class="kv">${kv}</div></div></div>` : ''}${how}${cols}<div><button class="btn" id="btnClearSel">Clear node selection</button></div></div>`;
}

function pathStepsUI() {
  const f = FLOWS.find((x) => x.id === flow);
  const ids = pathLocked ? [...activeNodes] : f.defaultPath;
  const seen = new Set();
  const ordered = [];
  ids.forEach((id) => {
    const n = graph.nodes.find((x) => x.id === id);
    const label = n?.step || n?.title || id;
    if (seen.has(label)) return;
    seen.add(label);
    ordered.push({ id, label, on: pathLocked ? activeNodes.has(id) : true });
  });
  return ordered;
}

function renderSvg() {
  const g = graph;
  const map = Object.fromEntries(g.nodes.filter((n) => !n.lane).map((n) => [n.id, n]));
  const edges = g.edges.map((e) => {
    const A = map[e.a], B = map[e.b];
    if (!A || !B) return '';
    const on = pathLocked && activeEdges.has(e.id);
    const dim = pathLocked && !activeEdges.has(e.id);
    const d = edgePath(A, B);
    const pt = edgeLabelPoint(A, B);
    const kind = e.kind || (e.dash ? 'link' : 'info');
    const marker = on ? `url(#arrow-${kind}-on)` : `url(#arrow-${kind})`;
    const lab = e.label ? `<text class="elabel ${kind} ${on ? 'on' : ''}" x="${pt.x}" y="${pt.y}" text-anchor="middle">${esc(e.label)}</text>` : '';
    return `<path class="edge ${kind} ${e.dash || kind==='link' ? 'dash' : ''} ${on ? 'on' : dim ? 'dim' : ''}" data-edge="${esc(e.id)}" marker-end="${marker}" d="${d}"/>${lab}`;
  }).join('');
  const nodes = g.nodes.filter((n) => !n.lane).map((n) => {
    const on = pathLocked && activeNodes.has(n.id);
    const dim = pathLocked && !activeNodes.has(n.id);
    const sel = selectedNode === n.id;
    const badge = n.stock === false
      ? `<rect x="${n.x + n.w - 54}" y="${n.y + 7}" width="48" height="14" rx="2" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1"/><text x="${n.x + n.w - 30}" y="${n.y + 17}" text-anchor="middle" fill="#6e6e73" font-size="8.5" font-weight="600" font-family="var(--font)">no stock</text>`
      : n.stock === true
        ? `<rect x="${n.x + n.w - 44}" y="${n.y + 7}" width="38" height="14" rx="2" fill="#eef6f1" stroke="#b7d0c2" stroke-width="1"/><text x="${n.x + n.w - 25}" y="${n.y + 17}" text-anchor="middle" fill="#3f7a5c" font-size="8.5" font-weight="600" font-family="var(--font)">stock</text>`
        : '';
    return `<g class="node ${on ? 'on' : ''} ${dim ? 'dim' : ''} ${sel ? 'selected' : ''}" data-node="${esc(n.id)}" data-kind="${esc(n.kind || '')}">
      <rect class="box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="3"/>
      ${badge}
      <text x="${n.x + 12}" y="${n.y + 24}">${esc(String(n.title).split('\n')[0])}</text>
      <text class="sub" x="${n.x + 12}" y="${n.y + 42}">${esc(n.sub || '')}</text>
    </g>`;
  }).join('');
  const mk = (id, fill) => `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${fill}"/></marker>`;
  return `<svg viewBox="0 0 ${g.width} ${g.height}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      ${mk('arrow-link','#b7a58a')}${mk('arrow-link-on','#9a7b4f')}
      ${mk('arrow-stockin','#7a9e8a')}${mk('arrow-stockin-on','#3f7a5c')}
      ${mk('arrow-stockout','#c4928e')}${mk('arrow-stockout-on','#b85c55')}
      ${mk('arrow-consume','#8aa3c4')}${mk('arrow-consume-on','#4a6fa5')}
      ${mk('arrow-info','#9aa3ad')}${mk('arrow-info-on','#5c6b7a')}
    </defs>
    ${edges}${nodes}
  </svg>`;
}

function showNode(kind, id) {
  selectedNode = id;
  pathLocked = true;
  const p = pathForNode(kind, id);
  activeNodes = setFrom(p.nodes);
  activeEdges = setFrom(p.edges);
  paintDiagram();
  const fn = DETAIL[kind];
  const detail = typeof fn === 'function' ? fn() : { title: id, blurb: '', example: `<div class="ex">${esc(id)}</div>` };
  renderInspector(detail, pathStepsUI());
  $('#hoverHint').innerHTML = `<b>Path locked:</b> ${esc(kind || id)} · live example below updates when you Play`;
  // Sync animated story to clicked purchase/sales type
  const sync = { type_pu:'pu', type_sr:'sr', type_ms_in:'ms', type_it_in:'it', type_sl:'sl', type_pr:'pr', type_wa:'wa', type_ms_out:'ms', type_it_out:'it' };
  if (sync[kind] && (flow === 'purchase' || flow === 'sales')) {
    animStoryKey = sync[kind]; animStep = 0; stopAnim(); renderAnimPanel();
  }
}

function showEdge(id) {
  const e = graph.edges.find((x) => x.id === id);
  if (!e) return;
  pathLocked = true;
  activeEdges = setFrom([e.id]);
  activeNodes = setFrom([e.a, e.b]);
  // keep connected path context for the edge's kind branch if available
  graph.edges.forEach((x) => {
    if (x.a === e.a || x.b === e.b || x.a === e.b || x.b === e.a) {
      if (x.kind === e.kind) { activeEdges.add(x.id); activeNodes.add(x.a); activeNodes.add(x.b); }
    }
  });
  selectedNode = null;
  paintDiagram();
  renderInspector(edgeDetail(e), pathStepsUI());
}

function paintDiagram() {
  $('#diagram').innerHTML = renderSvg();
}

function mountFlow() {
  const f = FLOWS.find((x) => x.id === flow);
  $('#title').textContent = f.title;
  $('#subtitle').textContent = f.subtitle;
  $('#legend').textContent = f.legend;
  graph = GRAPHS[flow]();
  applyDefaultPath();
  paintDiagram();
  // intro detail for flow
  const introKind = { supplier: 'po', ck: 'po', purchase: 'type_pu', sales: 'type_sl', closing: 'closing', pos: 'recipe' }[flow];
  renderInspector(DETAIL[introKind](), pathStepsUI());
  $('#hoverHint').innerHTML = `<b>Full diagram</b> — use Play below for a live animated example of this flow.`;
  mountAnimForFlow();
}

  if (!filtered.includes(schemaTable)) schemaTable = filtered[0] || names[0];
  const cols = SCHEMA[schemaTable] || [];
  return `<div class="panelpage"><div class="card"><h2>Schema tables (Excel)</h2><div class="pad">
    <input id="schemaSearch" class="chip" style="border-radius:3px;width:100%;max-width:420px;margin-bottom:10px;padding:8px 10px" placeholder="Search tables or columns…" value="${esc(schemaQ)}">

let animTimer = null;
let animStep = 0;
let animStoryKey = null; // e.g. purchase/pu
let animPlaying = false;

function stopAnim() {
  if (animTimer) { clearInterval(animTimer); animTimer = null; }
  animPlaying = false;
  const b = document.getElementById('animPlay');
  if (b) b.textContent = 'Play';
}

function currentAnimPack() {
  if (flow === 'supplier') return { root: LIVE_STORIES.supplier, steps: LIVE_STORIES.supplier.steps, key: 'supplier' };
  if (flow === 'ck') return { root: LIVE_STORIES.ck, steps: LIVE_STORIES.ck.steps, key: 'ck' };
  if (flow === 'purchase') {
    const sub = animStoryKey || 'pu';
    const st = LIVE_STORIES.purchase.stories[sub];
    return { root: LIVE_STORIES.purchase, steps: st.steps, key: 'purchase/' + sub, sub, subTitle: st.title };
  }
  if (flow === 'sales') {
    const sub = animStoryKey || 'sl';
    const st = LIVE_STORIES.sales.stories[sub];
    return { root: LIVE_STORIES.sales, steps: st.steps, key: 'sales/' + sub, sub, subTitle: st.title };
  }
  return null;
}

function renderAnimPanel() {
  const host = document.getElementById('liveAnim');
  if (!host) return;
  const pack = currentAnimPack();
  if (!pack) {
    host.innerHTML = `<div class="anim-empty">Open <b>Supplier PO</b>, <b>Purchase all types</b>, <b>Sales all types</b>, or <b>CK</b> for a live animated example below the diagram.</div>`;
    return;
  }
  const steps = pack.steps;
  if (animStep >= steps.length) animStep = 0;
  const s = steps[animStep];
  const picks = pack.root.pick || [];
  const stockEntries = Object.entries(s.stock || {}).filter(([k]) => k !== 'note');
  const activePick = pack.sub || (picks[0] && picks[0].id);
  host.innerHTML = `
    <div class="anim-head">
      <div>
        <div class="anim-eye">Live animated example</div>
        <strong>${esc(pack.subTitle || pack.root.title)}</strong>
      </div>
      <div class="anim-controls">
        <button type="button" class="btn" id="animPrev">Prev</button>
        <button type="button" class="btn primary" id="animPlay">${animPlaying ? 'Pause' : 'Play'}</button>
        <button type="button" class="btn" id="animNext">Next</button>
      </div>
    </div>
    ${picks.length > 1 ? `<div class="anim-picks">${picks.map((p) => `<button type="button" class="chip ${activePick === p.id ? 'active' : ''}" data-anim-pick="${esc(p.id)}">${esc(p.label)}</button>`).join('')}</div>` : ''}
    <div class="anim-track">
      ${steps.map((st, i) => `<div class="anim-node ${i === animStep ? 'on' : ''} ${i < animStep ? 'done' : ''}"><span>${i + 1}</span><b>${esc(st.title.replace(/^\d+\.\s*/, ''))}</b></div>${i < steps.length - 1 ? '<div class="anim-pipe"></div>' : ''}`).join('')}
    </div>
    <div class="anim-stage">
      <div class="anim-card">
        <h4>${esc(s.title)}</h4>
        <p>${esc(s.say)}</p>
        <div class="anim-meta"><b>Actors</b><span>${esc((s.actors || []).join(' · '))}</span></div>
        <div class="anim-meta"><b>Documents</b><span class="mono">${esc(s.docs || '—')}</span></div>
      </div>
      <div class="anim-stock">
        <h4>Stock snapshot</h4>
        ${stockEntries.map(([k, v]) => `<div class="stock-row"><span>${esc(k)}</span><strong class="pulse">${esc(v)}</strong></div>`).join('') || '<p class="muted">—</p>'}
        ${s.stock?.note ? `<p class="muted" style="margin-top:8px">${esc(s.stock.note)}</p>` : ''}
      </div>
    </div>
    <div class="anim-progress"><div style="width:${((animStep + 1) / steps.length) * 100}%"></div></div>
  `;
}

function playAnim() {
  const pack = currentAnimPack();
  if (!pack) return;
  if (animPlaying) { stopAnim(); return; }
  animPlaying = true;
  const b = document.getElementById('animPlay');
  if (b) b.textContent = 'Pause';
  animTimer = setInterval(() => {
    const p = currentAnimPack();
    if (!p) { stopAnim(); return; }
    animStep = (animStep + 1) % p.steps.length;
    renderAnimPanel();
    const btn = document.getElementById('animPlay');
    if (btn) btn.textContent = 'Pause';
    // also focus related diagram node when possible
    focusAnimOnDiagram(p);
  }, 2200);
}

function focusAnimOnDiagram(pack) {
  if (!graph || flow === 'closing' || flow === 'pos') return;
  const map = {
    'purchase/pu': 'type_pu', 'purchase/sr': 'type_sr', 'purchase/ms': 'type_ms_in', 'purchase/it': 'type_it_in',
    'sales/sl': 'type_sl', 'sales/pr': 'type_pr', 'sales/wa': 'type_wa', 'sales/ms': 'type_ms_out', 'sales/it': 'type_it_out',
    supplier: ['po', 'pur'][animStep < 2 ? 0 : 1],
    ck: ['po', 'sales_sl', 'purchase_so'][Math.min(animStep, 2)]
  };
  const key = pack.key;
  let kind = map[key];
  if (Array.isArray(kind)) kind = kind; // unused
  if (typeof map[key] === 'string') {
    const node = graph.nodes.find((n) => n.kind === map[key]);
    if (node) {
      pathLocked = true;
      const p = pathForNode(node.kind, node.id);
      activeNodes = setFrom(p.nodes);
      activeEdges = setFrom(p.edges);
      paintDiagram();
    }
  }
}

function mountAnimForFlow() {
  stopAnim();
  animStep = 0;
  if (flow === 'purchase') animStoryKey = 'pu';
  else if (flow === 'sales') animStoryKey = 'sl';
  else animStoryKey = null;
  renderAnimPanel();
}


function renderShell() {
  $('#navLinks').innerHTML = SECTIONS.map((s) => `<button data-section="${s.id}" class="${section === s.id ? 'active' : ''}">${esc(s.label)}</button>`).join('');
  const showFlows = section === 'flows';
  $('#flowbar').style.display = showFlows ? 'flex' : 'none';
  if (showFlows) {
    $('#flowbar').innerHTML = FLOWS.map((f) => `<button class="chip ${flow === f.id ? 'active' : ''}" data-flow="${f.id}"><span class="n">${f.n}</span>${esc(f.label)}</button>`).join('');
  }
  const work = document.querySelector('.work');
  if (section === 'flows') {
    work.innerHTML = `<section class="canvas">
      <div class="tools">
        <span class="pill"><i class="in"></i> Stock in <span style="opacity:.7">(qty enters)</span></span>
        <span class="pill"><i class="out"></i> Stock out <span style="opacity:.7">(qty leaves)</span></span>
        <span class="pill"><i class="con"></i> POS consume <span style="opacity:.7">(recipe)</span></span>
        <span class="pill"><i class="link"></i> Doc link <span style="opacity:.7">(no stock)</span></span>
        <span class="pill"><i class="info"></i> Info / EOD</span>
        <span class="sp"></span>
        <span id="hoverHint"></span>
      </div>
      <div class="diagram" id="diagram"></div>
      <div class="legend" id="legend"></div>
      <div id="liveAnim" class="live-anim"></div>
    </section>
    <aside class="insp" id="insp"></aside>`;
    mountFlow();
  } else {
    $('#title').textContent = SECTIONS.find((s) => s.id === section).label;
    $('#subtitle').textContent = 'Same one-page file — overview, Stock Summary, Excel schema, clean-table map, and codes.';
    const body = { overview: pageOverview, summary: pageSummary, schema: pageSchema, cleantables: pageClean, codes: pageCodes }[section]();
    work.innerHTML = `<div style="grid-column:1/-1">${body}</div>`;
  }
}

document.addEventListener('click', (e) => {
  const sec = e.target.closest('[data-section]');
  if (sec) { section = sec.dataset.section; renderShell(); return; }
  const fl = e.target.closest('[data-flow]');
  if (fl) { flow = fl.dataset.flow; section = 'flows'; renderShell(); return; }
  const of = e.target.closest('[data-open-flow]');
  if (of) { flow = of.dataset.openFlow; section = 'flows'; renderShell(); return; }
  const st = e.target.closest('[data-stable]');
  if (st) { schemaTable = st.dataset.stable; renderShell(); return; }
  if (e.target.closest('#btnClearSel') || e.target.closest('#btnResetPath')) {
    if (section === 'flows') { applyDefaultPath(); paintDiagram(); renderInspector(DETAIL[{ supplier: 'po', ck: 'po', purchase: 'type_pu', sales: 'type_sl', closing: 'closing', pos: 'recipe' }[flow]](), pathStepsUI()); }
    return;
  }
  if (e.target.closest('#btnDl')) {
    const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Petpooja_Inventory_Entry_Flow.html'; a.click();
  }
  const ap = e.target.closest('[data-anim-pick]');
  if (ap && section === 'flows') {
    stopAnim(); animStoryKey = ap.dataset.animPick; animStep = 0; renderAnimPanel();
    // lock diagram to that type
    const kindMap = { pu:'type_pu', sr:'type_sr', ms: flow==='sales'?'type_ms_out':'type_ms_in', it: flow==='sales'?'type_it_out':'type_it_in', sl:'type_sl', pr:'type_pr', wa:'type_wa' };
    const kind = kindMap[animStoryKey];
    if (kind && graph) {
      const node = graph.nodes.find((n) => n.kind === kind);
      if (node) showNode(node.kind, node.id);
    }
    return;
  }
  if (e.target.closest('#animPlay')) { playAnim(); return; }
  if (e.target.closest('#animNext')) {
    const p = currentAnimPack(); if (!p) return;
    stopAnim(); animStep = (animStep + 1) % p.steps.length; renderAnimPanel(); return;
  }
  if (e.target.closest('#animPrev')) {
    const p = currentAnimPack(); if (!p) return;
    stopAnim(); animStep = (animStep - 1 + p.steps.length) % p.steps.length; renderAnimPanel(); return;
  }
  const n = e.target.closest('[data-node]');
  if (n && section === 'flows') { showNode(n.dataset.kind, n.dataset.node); return; }
  const ed = e.target.closest('[data-edge]');
  if (ed && section === 'flows') showEdge(ed.dataset.edge);
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'schemaSearch') { schemaQ = e.target.value; renderShell(); }
});

renderShell();
